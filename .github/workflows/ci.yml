name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, format, types, build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The docs-only check diffs against the base branch, so it needs the full history.
          fetch-depth: 0

      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Docs-only pull requests run only the format check, which also covers Markdown.
      - name: Detect docs-only change
        id: changes
        if: github.event_name == 'pull_request'
        run: node scripts/ci-docs-only.ts

      - run: pnpm format:check
      - run: pnpm lint
        if: steps.changes.outputs.docs_only != 'true'
      - run: pnpm typecheck
        if: steps.changes.outputs.docs_only != 'true'
      - run: pnpm build
        if: steps.changes.outputs.docs_only != 'true'

      # The Supabase CLI version decides the image tags, so the cache is keyed on it.
      - name: Read Supabase CLI version
        id: supabase-cli
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          echo "version=$(node -p "require('./package.json').devDependencies.supabase")" >> "$GITHUB_OUTPUT"

      - name: Restore Supabase images cache
        id: supabase-images
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/cache@v4
        with:
          path: ~/supabase-images.tar.gz
          key: supabase-images-${{ steps.supabase-cli.outputs.version }}

      - name: Load cached Supabase images
        if: steps.changes.outputs.docs_only != 'true' && steps.supabase-images.outputs.cache-hit == 'true'
        run: gunzip -c ~/supabase-images.tar.gz | docker load

      # Only the database is needed for tests, so the other Supabase services stay off.
      - name: Start Supabase database
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm db:start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      # shortcut: saves every supabase/* image this run has, not only the ones this stack needs; upgrade by listing them if the cache gets large.
      - name: Save Supabase images cache
        if: steps.changes.outputs.docs_only != 'true' && steps.supabase-images.outputs.cache-hit != 'true'
        run: docker images --format '{{.Repository}}:{{.Tag}}' | grep supabase | xargs docker save | gzip > ~/supabase-images.tar.gz

      - run: pnpm test
        if: steps.changes.outputs.docs_only != 'true'
